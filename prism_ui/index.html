<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM - Product Requirement Intelligent SDLC Maestro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" aria-label="Navigation">
        <button type="button" class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
          </svg>
        </button>
        <button type="button" class="icon-btn" id="btn-new" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M5 5h5v2H7.4l7.3 7.3-1.4 1.4L6 8.4V11H4V5zm14 14H9v-2h8.6l-7.3-7.3 1.4-1.4 7.3 7.3V13h2v6z" />
          </svg>
        </button>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-brand" title="PRISM - Product Requirement Intelligent SDLC Maestro">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color: #8ab4f8" />
                <stop offset="100%" style="stop-color: #c58af9" />
              </linearGradient>
            </defs>
            <path fill="url(#grad)" d="M12 2l2.4 7.4H22l-6 4.6 2.3 7-6.3-4.6L5.7 21l2.3-7-6-4.6h7.6L12 2z" />
          </svg>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <span class="topbar-title">PRISM - Product Requirement Intelligent SDLC Maestro</span>
        </header>

        <section class="chat" id="chat" aria-live="polite">
          <div class="welcome" id="welcome">
            <p class="greeting" id="greeting">Hi I'm PRISM</p>
            <h1 class="headline">Where should we start?</h1>
          </div>
          <div class="messages" id="messages" hidden></div>
          <div class="progress-panel" id="progress-panel" hidden>
            <div class="progress-header">
              <div class="loader" aria-hidden="true"></div>
              <div>
                <p class="progress-title">Running SDLC agents</p>
                <p class="progress-sub" id="progress-sub">Preparing workflow…</p>
              </div>
            </div>
            <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
            <ul class="step-list" id="step-list"></ul>
          </div>
        </section>

        <footer class="composer-wrap">
          <div class="chips" id="chips">
            <button type="button" class="chip" data-prompt="Analyze these requirements for a login and OAuth MVP">Analyze login MVP</button>
            <button type="button" class="chip" data-prompt="Generate user stories and tasks for a payment service">Payment stories &amp; tasks</button>
            <button type="button" class="chip" data-prompt="Run security and compliance review on a healthcare patient portal">Security &amp; compliance</button>
          </div>
          <div class="composer" id="composer">
            <div class="attachments" id="attachments" hidden></div>
            <textarea id="input" class="composer-input" rows="1" placeholder="Ask PRISM…" aria-label="Message PRISM"></textarea>
            <div class="composer-toolbar">
              <div class="toolbar-left">
                <button type="button" class="icon-btn" id="btn-upload" title="Upload file" aria-label="Upload file">
                  <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <input type="file" id="file-input" hidden multiple accept=".pdf,.txt,.md,.html,.htm,.docx,.csv,.json" />
                <span class="format-hint" id="format-hint">pdf, docx, txt, md, html, csv, json</span>
              </div>
              <div class="toolbar-right">
                <button type="button" class="icon-btn" id="btn-voice" title="Voice input" aria-label="Voice input">
                  <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button type="button" class="send-btn" id="btn-send" title="Send" aria-label="Send" disabled>
                  <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="disclaimer">PRISM runs 22 SDLC agents on your requirements. Free LLM tiers may be slower or rate-limited.</p>
        </footer>
      </main>
    </div>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
