[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-copilot"
version = "0.1.0"
description = "Open-source friendly multi-agent SDLC copilot for requirements-to-delivery workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-chroma>=0.1.4",
  "langchain-text-splitters>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langgraph>=0.2.0",
  "chromadb>=0.5.0",
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "pandas>=2.2.2",
  "tabulate>=0.9.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "orjson>=3.10.7",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-anyio>=0.0.0", "ruff>=0.6.0", "mypy>=1.11.0"]
ui = ["streamlit>=1.38.0"]
whisper = ["faster-whisper>=1.0.0"]

[project.scripts]
sdlc-copilot = "sdlc_copilot.cli:app"

[tool.setuptools.packages.find]
include = ["sdlc_copilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "sdlc_copilot/main.py"
